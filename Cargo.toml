[package]
name = "pito-header"
version = "0.2.0"
authors = ["Gamer Dad"]
edition = "2024"
description = "A nested top navigation for ratatui apps: groups of numbered sections, drill-in with a breadcrumb, and two header rows that abbreviate to fit"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-header"
publish = false

[lib]
name = "pito_header"

[features]
crossterm = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"], optional = true }
ratatui = { version = "0.30", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"
